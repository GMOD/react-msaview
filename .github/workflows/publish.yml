name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          # pnpm is provisioned by Corepack below, after this step
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Enable Corepack
        run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # a tarball whose bin or exports point at files the build never made is
      # how react-msaview-cli reached npm with no dist at all
      - run: pnpm check:pack
      - run: pnpm publish -r --access public --no-git-checks --provenance

  pypi:
    name: Publish jbrowsemsa to PyPI
    runs-on: ubuntu-latest
    # PyPI trusted publishing: pypi.org lists this repository, this workflow
    # file and the `pypi` environment as the project's publisher, and the job
    # exchanges its OIDC token for an upload credential, so no API token lives
    # in the repository's secrets
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the widget bundle
        run: pnpm --filter jbrowsemsa build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build the sdist and wheel
        run: |
          pip install build
          python -m build --outdir dist packages/python
          unzip -l dist/*.whl | grep jbrowsemsa/static/widget.js
      - uses: pypa/gh-action-pypi-publish@release/v1
