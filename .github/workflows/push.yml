name: CI

# Pushes to main plus every pull request, so a fork's PR is checked before it
# lands rather than after.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build all packages
        run: pnpm build

      - name: Build app
        run: pnpm --filter app build

      - name: Typecheck
        run: pnpm typecheck

      # the CLI's PNG and PDF export tests shell out to rsvg-convert
      - name: Install librsvg
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Test
        run: pnpm test

      # the model API reference is generated from doc tags in model.ts, and
      # nothing else notices when a new member lands without a generator run
      - name: Check the model API docs are current
        run: node scripts/check-apidocs.mjs

      # the README SVGs are the export's own deterministic output, so a renderer
      # change that moves them fails here until `pnpm figures` reruns
      - name: Check the README figures match the renderer
        run: pnpm figures:check

      # a figure whose page stopped showing it stays in docs/media and keeps
      # being regenerated, with nothing to notice; the deploy's link check only
      # catches the other direction
      - name: Check every figure is shown by a page
        run: pnpm check:media

      # a renamed data file leaves the page building and the committed figure
      # unchanged, and 404s the live data= link the figure is a picture of
      - name: Check the hosted data every page links
        run: pnpm check:data

      # editing a spec moves the figure on the next capture but leaves the
      # guide's "click the screenshot" link on the state it used to show
      - name: Check the guide's live links match their specs
        run: pnpm check:guide-links

      # the section shape docs/tutorials/CLAUDE.md sets: who fetches the data,
      # what the build script does, no hosted output posing as a download
      - name: Check the tutorials keep their shape
        run: pnpm check:tutorials

      # what npm would receive: every manifest's bin/main/types/exports has to
      # exist in the tarball
      - name: Check the packs
        run: pnpm check:pack

  npm-smoke:
    name: Install from npm tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build all packages
        run: pnpm build

      # the render half drives the runner's Chrome; say so up front rather than
      # from inside puppeteer
      - name: Show the browser
        run: google-chrome --version

      # plain npm, outside the workspace, against the registry's @jbrowse/core
      # -- the tree published users get, which no other job installs
      - name: Install the tarballs and run them
        run: pnpm smoke:npm

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # no build first: the workspace's types resolve from src
      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  # each tutorial's R panel runs against ggmsaview's main as a reader pastes
  # it, so an R API change there that breaks a page fails here instead of
  # waiting for a reader
  tutorials-r:
    name: Tutorial R panels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            github::GMOD/ggmsaview
            any::ggplot2
            any::patchwork
            any::QuickJSR
            any::systemfonts
            any::withr
      - name: Run every R panel
        run: Rscript scripts/tutorials-r.R

  python:
    name: Python widget (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the floor pyproject.toml declares, and the newest release
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # the package installs only with the bundle built, since the wheel ships it
      - name: Build the widget bundle
        run: pnpm --filter jbrowsemsa build

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package
        run: pip install -e "packages/python[dev,examples]" build

      - name: Test
        run: pytest packages/python/tests

      # the notebooks read packages/examples/data and touch no network
      - name: Run the example notebooks
        run: python packages/python/scripts/run_examples.py --no-render

      - name: Build the wheel and check it carries the bundle
        run: |
          python -m build --wheel --outdir dist packages/python
          unzip -l dist/*.whl | grep jbrowsemsa/static/widget.js

  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pinned: @master has turned main red on its own, flagging amino acid
      # codes a new release started catching
      - uses: crate-ci/typos@v1.50.1

  attw:
    name: Check types (attw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build:lib

      - name: Check types with attw
        run: pnpm attw
