name: CI

# Pushes to main plus every pull request, so a fork's PR is checked before it
# lands rather than after.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build all packages
        run: pnpm build

      - name: Build app
        run: pnpm --filter app build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # the model API reference is generated from doc tags in model.ts, and
      # nothing else notices when a new member lands without a generator run
      - name: Check the model API docs are current
        run: node scripts/check-apidocs.mjs

      # the README SVGs are the export's own deterministic output, so a renderer
      # change that moves them fails here until `pnpm figures` reruns
      - name: Check the README figures match the renderer
        run: pnpm figures:check

      # a figure whose page stopped showing it stays in docs/media and keeps
      # being regenerated, with nothing to notice; the deploy's link check only
      # catches the other direction
      - name: Check every figure is shown by a page
        run: pnpm check:media

      # a renamed data file leaves the page building and the committed figure
      # unchanged, and 404s the live data= link the figure is a picture of
      - name: Check the hosted data every page links
        run: pnpm check:data

      # editing a spec moves the figure on the next capture but leaves the
      # guide's "click the screenshot" link on the state it used to show
      - name: Check the guide's live links match their specs
        run: pnpm check:guide-links

      # the section shape docs/tutorials/CLAUDE.md sets: who fetches the data,
      # what the build script does, no hosted output posing as a download
      - name: Check the tutorials keep their shape
        run: pnpm check:tutorials

      # what npm would receive: every manifest's bin/main/types/exports has to
      # exist in the tarball
      - name: Check the packs
        run: pnpm check:pack

  npm-smoke:
    name: Install from npm tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build all packages
        run: pnpm build

      # the render half drives the runner's Chrome; say so up front rather than
      # from inside puppeteer
      - name: Show the browser
        run: google-chrome --version

      # plain npm, outside the workspace, against the registry's @jbrowse/core
      # -- the tree published users get, which no other job installs
      - name: Install the tarballs and run them
        run: pnpm smoke:npm

  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # no build first: the workspace's types resolve from src
      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

  python:
    name: Python widget (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # the floor pyproject.toml declares, and the newest release
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # the package installs only with the bundle built, since the wheel ships it
      - name: Build the widget bundle
        run: pnpm --filter msaview-widget build

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the package
        run: pip install -e "packages/python[dev,examples]" build

      - name: Test
        run: pytest packages/python/tests

      # the notebooks read packages/examples/data and touch no network
      - name: Run the example notebooks
        run: python packages/python/scripts/run_examples.py --no-render

      - name: Build the wheel and check it carries the bundle
        run: |
          python -m build --wheel --outdir dist packages/python
          unzip -l dist/*.whl | grep msaview/static/widget.js

  spellcheck:
    name: Spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pinned: @master has turned main red on its own, flagging amino acid
      # codes a new release started catching
      - uses: crate-ci/typos@v1.50.1

  r-package:
    name: R package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # main tracks no bundle; the check and the r-dist branch both take the
      # one built from this commit
      - name: Build the widget bundle and the QuickJS core
        run: |
          pnpm build:lib
          pnpm --filter react-msaview build:umd
          pnpm sync:r-bundle
      - name: Check the bundles, msaview.yaml and DESCRIPTION name one version
        run: node scripts/sync-r-bundle.mjs --check

      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/r-msaview
          extra-packages: any::rcmdcheck, any::testthat, any::ape, any::roxygen2
      # NAMESPACE alone: another roxygen2 version can format man/ differently,
      # and R CMD check's codoc step catches a help page whose usage disagrees
      # with its function
      - name: Check NAMESPACE matches the roxygen tags
        working-directory: packages/r-msaview
        run: |
          Rscript -e 'roxygen2::roxygenise(roclets = "namespace")'
          git diff --exit-code -- NAMESPACE
      # check-r-package runs the testthat suite as part of R CMD check, which
      # also catches exports without help pages and undeclared imports
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/r-msaview
          error-on: '"warning"'
      - uses: actions/upload-artifact@v4
        with:
          name: r-package
          path: |
            packages/r-msaview
            !packages/r-msaview/check
          include-hidden-files: true

  # The installable R package, bundles included, as the one commit of the
  # r-dist branch: `install_github("GMOD/JBrowseMSA@r-dist")` gets main's R code
  # with main's JavaScript, and the force push keeps superseded bundles out of
  # every clone's history
  r-dist:
    name: Publish the r-dist branch
    needs: [build-and-test, lint, r-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: r-dist
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: r-package
          path: r-package
      - name: Force-push the package as one commit
        working-directory: r-package
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b r-dist
          git add -A
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "msaviewr built from GMOD/JBrowseMSA@${GITHUB_SHA}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" r-dist

  attw:
    name: Check types (attw)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      - name: Build packages
        run: pnpm build:lib

      - name: Check types with attw
        run: pnpm attw
