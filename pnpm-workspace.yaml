packages:
  - 'packages/*'
  - 'website'
# Only install releases at least 3 days old (in minutes), as a guard against
# freshly compromised packages. Our own scopes are exempt, since we bump them
# minutes after releasing them. The rest are fresh bumps the lockfile already
# vetted; drop each once it ages past the window.
minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - '@gmod/*'
  - '@jbrowse/*'
  - '@astrojs/*'
  - astro
  - tldts
  - tldts-core
  # our own package, bumped minutes after release; drop once 2.2.0 ages past the window
  - p2s_mapper
allowBuilds:
  '@scarf/scarf': false
  core-js-pure: false
  esbuild: true
  sharp: true
  unrs-resolver: true
